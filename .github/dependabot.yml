version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  # Hash-pinned tool requirements used by privileged workflows (release, knowledge graph).
  # Dependabot updates the pinned version and regenerates the hashes.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      workflow-tools:
        patterns: ["*"]
