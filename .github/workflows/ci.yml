name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv run --group dev ruff check src tests benchmarks
      - run: uv run --group dev black --check src tests benchmarks

  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      # The Delta JARs the `spark` fixture in tests/conftest.py downloads
      # straight from Maven Central (bypassing the JVM's own Ivy resolver,
      # see the fixture's docstring) land here, keyed on uv.lock since that's
      # what pins the delta-spark version. Caching them turns repeat CI runs'
      # jar fetch into a no-op instead of ~3 fresh downloads every time.
      - uses: actions/cache@v4
        with:
          path: /tmp/unidetect-test-jars
          key: ${{ runner.os }}-delta-jars-${{ hashFiles('uv.lock') }}
      - run: uv sync --locked
      - run: uv run pytest --cov=unidetect --cov-report=term-missing -n auto

  type-check:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run mypy src
