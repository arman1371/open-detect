name: Benchmark

on:
  workflow_dispatch:

jobs:
  wiki-subset:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2
            ~/.m2/repository
          key: ${{ runner.os }}-ivy-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-ivy-
      - run: uv sync
      - run: uv run python benchmarks/wiki_subset/run_benchmark.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wiki-subset-benchmark-results
          path: benchmarks/wiki_subset/results/latest.json
          if-no-files-found: warn
          retention-days: 90

  real-world-gov:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2
            ~/.m2/repository
          key: ${{ runner.os }}-ivy-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-ivy-
      - run: uv sync
      - run: uv run python benchmarks/real_world_gov/run_benchmark.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: real-world-gov-benchmark-results
          path: benchmarks/real_world_gov/results/latest.json
          if-no-files-found: warn
          retention-days: 90
