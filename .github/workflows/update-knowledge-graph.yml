name: Update Knowledge Graph

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-knowledge-graph
  cancel-in-progress: false

jobs:
  update-graph:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install graphify
        run: pip install --quiet graphifyy

      - name: Update knowledge graph
        run: graphify update .

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json graphify-out/graph.html graphify-out/GRAPH_REPORT.md
          if git diff --cached --quiet; then
            echo "No graph changes to commit."
          else
            git commit -m "chore: update knowledge graph [skip ci]"
            git push origin HEAD:main
          fi
