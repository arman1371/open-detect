# Keeps graphify-out/ current by pushing straight to main over SSH with the repo deploy key
# (RELEASE_DEPLOY_KEY), which is a bypass actor on the main ruleset. GITHUB_TOKEN cannot bypass
# the ruleset. See docs/contributing.md "Knowledge graph automation".
name: Update Knowledge Graph

on:
  push:
    branches: [main]
    paths-ignore:
      - "graphify-out/**"
  workflow_dispatch:

concurrency:
  group: update-knowledge-graph
  cancel-in-progress: false

jobs:
  update-graph:
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: update knowledge graph')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install graphify
        run: pip install --quiet graphifyy

      - name: Update knowledge graph
        run: graphify update .

      - name: Commit and push updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json graphify-out/graph.html graphify-out/GRAPH_REPORT.md
          if git diff --cached --quiet; then
            echo "No graph changes to commit."
          else
            git commit -m "chore: update knowledge graph [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
