name: Update Knowledge Graph

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-knowledge-graph
  cancel-in-progress: false

jobs:
  update-graph:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update knowledge graph with graphify
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A pull request was just merged into main. Refresh this repo's
            graphify knowledge graph so it reflects the current state of the
            code.

            Run `/graphify . --update` and follow the graphify skill
            (.claude/skills/graphify/SKILL.md) exactly, including its
            `--update` runbook (references/update.md) and the community
            labeling step. Merged changes here are ordinary source code, so
            this should complete via structural (AST) extraction only, with
            no API key and no subagent dispatch needed — only fall back to
            dispatching subagents if the diff actually contains new/changed
            docs, papers, or images.

            When the pipeline finishes, check `git status` for changes under
            graphify-out/. If there are none, stop — do not create an empty
            commit. If there are changes:

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add graphify-out
              git commit -m "chore: update knowledge graph [skip ci]"
              git push origin HEAD:main

            Do not modify any files outside graphify-out/.
          claude_args: |
            --max-turns 60
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent"
