name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Quality Gate
    runs-on: [self-hosted, Linux, X64]
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required for SonarCloud's new-code and blame analysis.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # See the matching step in ci.yml: the `spark` fixture in
      # tests/conftest.py downloads Delta's JARs straight from Maven Central
      # into this path, bypassing the JVM's own Ivy resolver.
      - uses: actions/cache@v4
        with:
          path: /tmp/unidetect-test-jars
          key: ${{ runner.os }}-delta-jars-${{ hashFiles('uv.lock') }}

      - run: uv sync --locked

      - name: Run tests with coverage
        run: uv run pytest --cov=unidetect --cov-report=xml:coverage.xml --cov-report=term-missing -n auto

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
