name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required for SonarCloud's new-code and blame analysis.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2
            ~/.m2/repository
          key: ${{ runner.os }}-ivy-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-ivy-

      - run: uv sync

      - name: Run tests with coverage
        run: uv run pytest --cov=open_detect --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
