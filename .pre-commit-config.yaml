# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyspark-version-constraint
        name: Check pyspark version constraint in pyproject.toml
        entry: scripts/check_pyspark_version.py
        language: python
        files: pyproject.toml
        verbose: true
        # The repo supports Python 3.10, where the stdlib ``tomllib`` module is
        # unavailable. The hook falls back to the ``tomli`` backport, which is
        # installed into the hook's own virtualenv below. Running on 3.10 is
        # required so the fallback path is actually exercised.
        language_version: "3.10"
        additional_dependencies: ["tomli>=2.0"]