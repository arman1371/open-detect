# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyspark-version-constraint
        name: Check pyspark version constraint in pyproject.toml
        entry: /paperclip/instances/default/workspaces/bd7b3e13-0c9e-4465-82cd-8ea9c7959798/.venv/bin/python scripts/check_pyspark_version.py
        language: system
        files: pyproject.toml
        verbose: true
