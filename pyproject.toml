[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "open-detect"
version = "0.2.0"
description = "A library of pluggable, paper-backed error detection algorithms for tabular data (Uni-Detect, Raha, ...)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "open-detect contributors" }]
keywords = ["data-quality", "data-cleaning", "error-detection", "databricks", "unity-catalog", "spark", "raha"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
spark = [
  "pyspark>=3.5,<4.0",
  # PySpark 3.5's Arrow serialization (pandas_udf/mapInPandas) is only
  # tested against pyarrow up to ~14.x; pyarrow 15+ has been observed to
  # raise "Expected Array, got ChunkedArray" for array-typed columns.
  "pyarrow>=11,<15",
  # pyarrow<15 wheels are built against the NumPy 1.x ABI and segfault/
  # raise under NumPy 2.x ("compiled using NumPy 1.x cannot be run in
  # NumPy 2.x").
  "numpy<2",
]
raha = [
  "scikit-learn>=1.3",
  "scipy>=1.10",
]
auto_validate = [
  "scipy>=1.10",
]
[project.urls]
Homepage = "https://github.com/arman1371/open-detect"
Repository = "https://github.com/arman1371/open-detect"
Documentation = "https://arman1371.github.io/open-detect/"

[project.scripts]
build_corpus_statistics_job = "open_detect.jobs.build_corpus_statistics:main"
run_detection_job = "open_detect.jobs.run_detection:main"

# Third-party algorithms register themselves here, under their own package,
# without any code changes in open_detect itself -- see
# open_detect/algorithms/registry.py. Example:
# [project.entry-points."open_detect.algorithms"]
# my_algorithm = "my_package.module:MyAlgorithmClass"

[tool.hatch.build.targets.wheel]
packages = ["src/open_detect"]

[dependency-groups]
dev = [
  "pyspark>=3.5,<4.0",
  "pyarrow>=11,<15",
  "numpy<2",
  "delta-spark>=3.1,<4.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.10",
  "pandas-stubs",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.semantic_release]
# Versioning is driven by Conventional Commits on `main`. See docs/contributing.md.
tag_format = "v{version}"
commit_parser = "conventional"
branch = "main"
allow_zero_version = true # stay on 0.y.z until we deliberately cut 1.0.0
major_on_zero = false # while < 1.0.0: breaking change -> minor bump, feat -> minor, fix/perf -> patch
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): v{version} [skip ci]"
# Refresh the project's own entry in uv.lock so `uv sync --locked` keeps working, then build.
build_command = """
  uv lock --upgrade-package open-detect
  git add uv.lock
  uv build
"""

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
allowed_tags = ["feat", "fix", "perf", "docs", "build", "chore", "ci", "refactor", "revert", "style", "test"]
default_bump_level = 0

[tool.semantic_release.changelog]
template_dir = ".github/semantic-release/templates"
mode = "update"
exclude_commit_patterns = [
  '''^(chore|ci|style|test|build)(\([^)]*\))?:.*''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
